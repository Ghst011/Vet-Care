<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Usuario - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);" th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'"></h2>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

		<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-3" style="max-width: 480px;"
     		 onsubmit="return confirmarGuardar(this)">
                  <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Contraseña
                    <span class="text-muted" th:if="${usuario.id} != null" style="font-size:12px;">
                        (déjala vacía para no cambiarla)
                    </span>
                </label>
                <input type="password" class="form-control" name="passwordPlano"
                       th:required="${usuario.id} == null">
            </div>

            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" th:field="*{rol}" required>
                    <option value="">-- Selecciona un rol --</option>
                    <option value="VETERINARIO">Veterinario</option>
                    <option value="ASISTENTE">Asistente</option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" th:field="*{estado}">
                <label class="form-check-label">Activo</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
        <p class="mt-3"><a th:href="@{/usuarios}">&larr; Volver al listado</a></p>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>

</body>
</html>
