<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Pagos - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);">Pagos registrados</h2>

        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Cita</th>
                <th>Mascota</th>
                <th>Cliente</th>
                <th>Veterinario</th>
                <th>Fecha de pago</th>
                <th>Monto</th>
                <th>Registrado por</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pagos}">
                <td th:text="${p.idPago}"></td>
                <td>
                    <a th:href="@{/citas/detalle/{id}(id=${p.cita.idCita})}" th:text="'#' + ${p.cita.idCita}"></a>
                </td>
                <td th:text="${p.cita.mascota.nombre}"></td>
                <td th:text="${p.cita.mascota.cliente.nombre} + ' ' + ${p.cita.mascota.cliente.apellido}"></td>
                <td th:text="${p.cita.veterinario.nombre} + ' ' + ${p.cita.veterinario.apellido}"></td>
                <td th:text="${p.fechaPago}"></td>
                <td th:text="'S/ ' + ${p.montoPagado}"></td>
                <td><span class="badge bg-secondary" th:text="${p.registradoPor}"></span></td>
            </tr>
            </tbody>
        </table>

        <div class="alert alert-info" th:if="${#lists.isEmpty(pagos)}">
            Todavía no hay pagos registrados.
        </div>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
