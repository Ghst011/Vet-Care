<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="vetcare-sidebar d-flex flex-column" th:fragment="sidebar">
    <div class="text-center mb-4">
        <h4 class="fw-bold text-white">🐾 VetCare</h4>
        <small class="text-white-50">Gestión veterinaria</small>
    </div>

    <nav class="nav flex-column gap-1 flex-grow-1">
        <a class="nav-link text-white" th:href="@{/}"><i class="bi bi-house-door me-2"></i>Inicio</a>
        <hr class="text-white-50">

        <a class="nav-link text-white" th:href="@{/clientes}"
           sec:authorize="hasAnyRole('ADMIN','ASISTENTE','VETERINARIO')">
            <i class="bi bi-person me-2"></i>Clientes
        </a>
        <a class="nav-link text-white" th:href="@{/mascotas}"
           sec:authorize="hasAnyRole('ADMIN','ASISTENTE','VETERINARIO')">
            <i class="bi bi-heart me-2"></i>Mascotas
        </a>
        <a class="nav-link text-white" th:href="@{/citas}"
           sec:authorize="hasAnyRole('ADMIN','ASISTENTE','VETERINARIO')">
            <i class="bi bi-calendar-check me-2"></i>Citas
        </a>
        <hr class="text-white-50" sec:authorize="hasRole('ADMIN')">

        <a class="nav-link text-white" th:href="@{/veterinarios}" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-clipboard2-pulse me-2"></i>Veterinarios
        </a>
        <a class="nav-link text-white" th:href="@{/asistentes}" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-person-badge me-2"></i>Asistentes
        </a>
        <hr class="text-white-50" sec:authorize="hasRole('ADMIN')">

        <a class="nav-link text-white" th:href="@{/especies}" sec:authorize="hasAnyRole('ADMIN','ASISTENTE')">
            <i class="bi bi-tag me-2"></i>Especies
        </a>
        <a class="nav-link text-white" th:href="@{/servicios}" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-list-check me-2"></i>Servicios
        </a>
        <hr class="text-white-50" sec:authorize="hasRole('ADMIN')">

        <a class="nav-link text-white" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-lock me-2"></i>Usuarios
        </a> 
        <a class="nav-link text-white" th:href="@{/pagos}" sec:authorize="hasRole('ADMIN')"> 
        		<i class="bi bi-cash-coin me-2"></i>Pagos
		</a>
		</nav>

    <div class="border-top pt-3 mt-3" style="border-color: rgba(255,255,255,0.2) !important;">
        <p class="text-white-50 mb-2" style="font-size: 13px;">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">usuario</span>
        </p>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-light w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </div>
</aside>
</body>
</html>
