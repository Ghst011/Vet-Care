<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Especies - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);">Especies</h2>
        <a class="btn btn-primary mb-3" th:href="@{/especies/nuevo}">+ Nueva especie</a>
        <table class="table table-hover">
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${especies}">
                <td th:text="${e.idEspecie}"></td>
                <td th:text="${e.nombre}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/especies/editar/{id}(id=${e.idEspecie})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" href="#" 
                    	th:onclick="'return confirmarEliminacion(\'' + @{/especies/eliminar/{id}(id=${e.idEspecie})} + '\')'">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
