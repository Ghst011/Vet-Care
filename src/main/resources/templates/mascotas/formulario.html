<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Mascota - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);" th:text="${mascota.idMascota} != null ? 'Editar mascota' : 'Nueva mascota'"></h2>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
		<form id="formMascota" th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post" class="mt-3" style="max-width: 480px;">            <input type="hidden" th:field="*{idMascota}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Peso (kg)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{peso}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Sexo</label>
                <select class="form-select" th:field="*{sexo}" required>
                    <option value="">-- Selecciona --</option>
                    <option value="M">Macho</option>
                    <option value="H">Hembra</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Dueño (Cliente)</label>
                <input type="text" id="buscarCliente" class="form-control" autocomplete="off" required
                       placeholder="Escribe el nombre o DNI del cliente..."
                       th:value="${mascota.cliente != null} ? ${mascota.cliente.nombre} + ' ' + ${mascota.cliente.apellido} + ' - DNI ' + ${mascota.cliente.dni} : ''">
                <input type="hidden" id="clienteSeleccionado" name="cliente"
                       th:value="${mascota.cliente != null} ? ${mascota.cliente.idPersona} : ''">
                <div id="sugerenciasCliente" class="list-group" style="max-height:180px; overflow-y:auto; display:none;"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Especie</label>
                <select class="form-select" th:field="*{especie}" required>
                    <option value="">-- Selecciona una especie --</option>
                    <option th:each="e : ${especies}"
                            th:value="${e.idEspecie}"
                            th:text="${e.nombre}"></option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" onclick="validarYGuardarMascota()">Guardar</button>
        </form>
        <p class="mt-3"><a th:href="@{/mascotas}">&larr; Volver al listado</a></p>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    const clientes = /*[[${clientes}]]*/ [];
</script>
<div th:replace="~{layout/scripts :: scripts}"></div>
<script th:src="@{/js/buscador-cliente.js}"></script>
</body>
</html>
