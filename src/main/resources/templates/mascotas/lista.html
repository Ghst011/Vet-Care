<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Mascotas - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);">Mascotas</h2>
        <a class="btn btn-primary mb-3" th:href="@{/mascotas/nuevo}">+ Nueva mascota</a>
        <table class="table table-hover">
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Especie</th><th>Dueño</th><th>Sexo</th><th>Peso</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mascotas}">
                <td th:text="${m.idMascota}"></td>
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.especie.nombre}"></td>
                <td th:text="${m.cliente.nombre} + ' ' + ${m.cliente.apellido}"></td>
                <td th:text="${m.sexo}"></td>
                <td th:text="${m.peso}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/mascotas/editar/{id}(id=${m.idMascota})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" href="#" 
                    	th:onclick="'return confirmarEliminacion(\'' + @{/mascotas/eliminar/{id}(id=${m.idMascota})} + '\')'">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
