<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
      <head th:replace="~{layout/header :: header('Detalle de cita - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);">Cita #<span th:text="${cita.idCita}"></span></h2>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <p><b>Mascota:</b> <span th:text="${cita.mascota.nombre}"></span></p>
                <p><b>Dueño:</b> <span th:text="${cita.mascota.cliente.nombre} + ' ' + ${cita.mascota.cliente.apellido}"></span></p>
                <p><b>Veterinario:</b> <span th:text="${cita.veterinario.nombre} + ' ' + ${cita.veterinario.apellido}"></span></p>
                <p><b>Fecha:</b> <span th:text="${cita.fecha}"></span> — <b>Hora:</b> <span th:text="${cita.hora}"></span></p>
                <p><b>Motivo:</b> <span th:text="${cita.motivo}"></span></p>
                <p><b>Estado:</b> <span class="badge bg-secondary" th:text="${cita.estado}"></span></p>
            </div>
        </div>

        <h5 style="color: var(--vetcare-verde);">Servicios</h5>
        <table class="table">
            <thead>
            <tr><th>Servicio</th><th>Cantidad</th><th>Subtotal</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${cita.detalles}">
                <td th:text="${d.servicio.nombre}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="${d.subtotal}"></td>
            </tr>
            </tbody>
        </table>
        <p><b>Total:</b> <span th:text="${cita.total}"></span></p>
			<div class="alert alert-success mt-3"
				th:if="${cita.estado.name() == 'PAGADA'}">
				<i class="bi bi-check-circle-fill me-1"></i> Cita pagada — S/ <span
					th:text="${cita.total}"></span>
			</div>

			<form th:if="${cita.estado.name() == 'PENDIENTE'}"
				sec:authorize="hasAnyRole('ADMIN','VETERINARIO')"
				th:action="@{/citas/avanzar/{id}(id=${cita.idCita})}" method="post"
				style="display: inline">
				<input type="hidden" name="nuevoEstado" value="EN_ATENCION">
				<button type="submit" class="btn btn-primary">Iniciar
					atención</button>
			</form>

			<form th:if="${cita.estado.name() == 'EN_ATENCION'}"
				sec:authorize="hasAnyRole('ADMIN','VETERINARIO')"
				th:action="@{/citas/avanzar/{id}(id=${cita.idCita})}" method="post"
				style="display: inline">
				<input type="hidden" name="nuevoEstado" value="FINALIZADA">
				<button type="submit" class="btn btn-primary">Finalizar
					cita</button>
			</form>

			<form th:if="${cita.estado.name() == 'FINALIZADA'}"
				sec:authorize="hasAnyRole('ADMIN','ASISTENTE')"
				th:action="@{/citas/avanzar/{id}(id=${cita.idCita})}" method="post"
				style="display: inline">
				<input type="hidden" name="nuevoEstado" value="PAGADA">
				<button type="submit" class="btn btn-primary">Registrar
					pago</button>
			</form>

			<p class="mt-3"><a th:href="@{/citas}">&larr; Volver al listado</a></p>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
