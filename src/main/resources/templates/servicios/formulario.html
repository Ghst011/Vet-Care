<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Servicio - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);" th:text="${servicio.idServicio} != null ? 'Editar servicio' : 'Nuevo servicio'"></h2>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post" class="mt-3" style="max-width: 480px;">
            <input type="hidden" th:field="*{idServicio}">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" th:field="*{descripcion}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" th:field="*{activo}">
                <label class="form-check-label">Activo</label>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
        <p class="mt-3"><a th:href="@{/servicios}">&larr; Volver al listado</a></p>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
