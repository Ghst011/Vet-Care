<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Servicios - VetCare')}"></head>
<body>
<div class="vetcare-layout">
    <main class="vetcare-main">
        <h2 style="color: var(--vetcare-verde);">Servicios</h2>
        <a class="btn btn-primary mb-3" th:href="@{/servicios/nuevo}">+ Nuevo servicio</a>
        <table class="table table-hover">
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Activo</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.idServicio}"></td>
                <td th:text="${s.nombre}"></td>
                <td th:text="${s.precio}"></td>
                <td th:text="${s.activo} ? 'Sí' : 'No'"></td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/servicios/editar/{id}(id=${s.idServicio})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" href="#" 
                    	th:onclick="'return confirmarEliminacion(\'' + @{/servicios/eliminar/{id}(id=${s.idServicio})} + '\')'">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
